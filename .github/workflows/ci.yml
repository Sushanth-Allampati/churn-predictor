name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test data and model artifacts
        run: |
          python tests/create_test_data.py
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests.conftest import setup_ci_artifacts
          setup_ci_artifacts()
          "
        env:
          PYTHONPATH: .

      - name: Lint with flake8
        run: |
          flake8 src/ api/ --max-line-length=100 --count --statistics
            --ignore=W291,W292,W293,W391,W503,W504,E501,F541,F841
            --per-file-ignores=src/tune.py:F811 api/schemas.py:F811
        continue-on-error: true

      - name: Run feature pipeline tests
        run: |
          pytest tests/test_features.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run training tests
        run: |
          pytest tests/test_train.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Coverage report
        run: |
          pytest tests/test_features.py tests/test_train.py tests/test_api.py --cov=src --cov=api --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create model artifacts for Docker build
        run: |
          python tests/create_test_data.py
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests.conftest import setup_ci_artifacts
          setup_ci_artifacts()
          "
        env:
          PYTHONPATH: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: churn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts correctly
        run: |
          docker run -d --name churn-api-test -p 8000:8000 churn-api:ci
          echo "Waiting for container to start..."
          sleep 30
          curl -f http://localhost:8000/health || exit 1
          echo "Health check passed"
          docker stop churn-api-test
          docker rm churn-api-test
