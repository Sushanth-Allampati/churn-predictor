name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test data and model artifacts
        run: |
          python tests/create_test_data.py
          python tests/conftest.py
        env:
          PYTHONPATH: .

      - name: Lint with flake8
        run: |
          flake8 src/ api/ --max-line-length=100 --count --statistics

      - name: Run feature pipeline tests
        run: |
          pytest tests/test_features.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run training tests
        run: |
          pytest tests/test_train.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --tb=short
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Coverage report
        run: |
          pytest tests/test_features.py tests/test_train.py tests/test_api.py
            --cov=src --cov=api --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
